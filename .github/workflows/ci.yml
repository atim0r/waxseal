name: CI

on:
  push:
  pull_request:

# The build only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw -B --no-transfer-progress verify
      - name: Attack walkthrough
        shell: bash
        run: java -jar target/waxseal-0.1.0.jar demo
